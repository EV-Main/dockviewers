name: Grafana plugin

# A `grafana-v<version>` tag releases `tilers_grafana/plugin` as the zip Grafana's
# `plugins.preinstall_sync` downloads.
on:
  push:
    tags: ['grafana-v*']

permissions:
  contents: write

# .cargo/config.toml pins rustc-wrapper=sccache for local dev; runners have no sccache.
env:
  RUSTC_WRAPPER: ""

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tilers_grafana/plugin
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "grafana-v$version" ] || { echo "tag $GITHUB_REF_NAME, package.json $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.125
      # Ubuntu's binaryen exports wasm-bindgen's externref table as the funcref one; 132 is what was verified.
      - name: binaryen
        run: |
          curl -sfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"
      - name: Build wasm
        working-directory: .
        run: |
          cargo build --release -p tilers_grafana --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir tilers_grafana/plugin/src/wasm target/wasm32-unknown-unknown/release/tilers_grafana.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int -o tilers_grafana/plugin/src/wasm/tilers_grafana_bg.wasm tilers_grafana/plugin/src/wasm/tilers_grafana_bg.wasm
      - uses: actions/setup-node@v4
        with:
          node-version-file: tilers_grafana/plugin/.nvmrc
          cache: npm
          cache-dependency-path: tilers_grafana/plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run build
      - name: Zip
        run: |
          cp -r dist evmain-tilers-app
          zip -r "evmain-tilers-app-$VERSION.zip" evmain-tilers-app
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "evmain-tilers-app-$VERSION.zip" --title "Grafana plugin $VERSION" --notes-file CHANGELOG.md
