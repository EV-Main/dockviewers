[package]
name = "dockviewers_grafana"
version = "0.1.0"
edition = "2024"
description = "Grafana app plugin rendering a dashboard through the dockviewers Leptos binding."
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-Main/dockviewers"
publish = false # ships as the plugin zip; `plugin/package.json` holds the release version

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = { workspace = true }
dockviewers_leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
leptos.workspace = true
send_wrapper = { workspace = true }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["HtmlElement", "console"] }

[lints]
workspace = true
